<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Lalan AI · Tu salón</title>
    <meta name="description" content="Lalan AI - Live Assistant for Logistics, Appointments & Networks. Gestión inteligente de salón, agenda, hospitalidad y experiencia VIP." />
    <meta property="og:title" content="Lalan AI - Live Assistant for Logistics, Appointments & Networks" />
    <meta property="og:description" content="Lalan AI - Live Assistant for Logistics, Appointments & Networks. Gestión inteligente de salón, agenda, hospitalidad y experiencia VIP." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!--
      La pantalla de pared, instalada como aplicación.

      Sirve para lo que el botón de pantalla completa no puede garantizar: los
      navegadores solo conceden la pantalla completa a un toque hecho en ese
      mismo aparato, nunca a una orden que llega por la red. Instalada
      ("Instalar aplicación" / "Añadir a la pantalla de inicio"), la pared
      abre SIN barra de direcciones, siempre, sin que nadie toque nada.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icono-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icono-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icono-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lalan AI" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#09090b" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc" />
    <meta name="theme-color" content="#09090b" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&display=swap" rel="stylesheet">
    <script>
      /* Detección temprana de iOS y modo pantalla completa/PWA para garantizar el espacio seguro del notch */
      (function() {
        try {
          var ua = navigator.userAgent || '';
          var isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
          var isStandalone = window.navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
          if (isIOS) document.documentElement.classList.add('is-ios');
          if (isStandalone) document.documentElement.classList.add('is-standalone');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-neutral-900 antialiased font-sans overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      /* Registro del Service Worker y comprobación inmediata de versiones */
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').then(function (reg) {
            if (reg) {
              reg.update().catch(function () {});
            }
          }).catch(function () {});
        });
      }
    </script>
  </body>
</html>
