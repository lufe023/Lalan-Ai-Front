<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Lalan AI · Tu salón</title>
    <meta name="description" content="Lalan AI - Live Assistant for Logistics, Appointments & Networks. Gestión inteligente de salón, agenda, hospitalidad y experiencia VIP." />
    <meta property="og:title" content="Lalan AI - Live Assistant for Logistics, Appointments & Networks" />
    <meta property="og:description" content="Lalan AI - Live Assistant for Logistics, Appointments & Networks. Gestión inteligente de salón, agenda, hospitalidad y experiencia VIP." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!--
      La pantalla de pared, instalada como aplicación.

      Sirve para lo que el botón de pantalla completa no puede garantizar: los
      navegadores solo conceden la pantalla completa a un toque hecho en ese
      mismo aparato, nunca a una orden que llega por la red. Instalada
      ("Instalar aplicación" / "Añadir a la pantalla de inicio"), la pared
      abre SIN barra de direcciones, siempre, sin que nadie toque nada.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icono-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icono-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icono-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lalan AI" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#09090b" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc" />
    <meta name="theme-color" content="#09090b" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&display=swap" rel="stylesheet">
    <script>
      /* Detección temprana de iOS y modo pantalla completa/PWA para garantizar el espacio seguro del notch */
      (function() {
        try {
          var ua = navigator.userAgent || '';
          var isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
          var isStandalone = window.navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
          if (isIOS) document.documentElement.classList.add('is-ios');
          if (isStandalone) document.documentElement.classList.add('is-standalone');
          /* iPhone con la app instalada: iOS mide la página más corta que la
             pantalla. La app usa el alto REAL de la pantalla, y la página no
             debe desplazarse nunca (si se corre, la app sube y el menú baja). */
          if (isIOS && isStandalone) {
            var raiz = document.documentElement;
            var fijarAlto = function () {
              var vertical = window.innerHeight >= window.innerWidth;
              var alto = vertical ? Math.max(screen.height, screen.width) : Math.min(screen.height, screen.width);
              raiz.style.setProperty('--alto-app', alto + 'px');
            };
            fijarAlto();
            window.addEventListener('resize', fijarAlto);
            window.addEventListener('orientationchange', function () { setTimeout(fijarAlto, 300); });
            window.addEventListener('scroll', function () { if (window.scrollY !== 0) window.scrollTo(0, 0); }, { passive: true });
          }
        } catch (e) {}
      })();
    </script>
    <style>
      /* Mismo arreglo que en index.css (iPhone, app instalada) para el splash inicial */
      html.is-ios.is-standalone, html.is-ios.is-standalone body { height: var(--alto-app, 100%); overflow: hidden; background: #09090b; }
      html.is-ios.is-standalone #pre-react-splash { position: absolute !important; bottom: auto !important; height: var(--alto-app, 100%); }
    </style>
  </head>
  <body class="bg-neutral-900 antialiased font-sans overflow-x-hidden">
    <div id="root">
      <!-- Splash Screen instantáneo inline: se muestra en 0ms y evita pantallas en blanco sin internet -->
      <div id="pre-react-splash" style="position:fixed;inset:0;background:#09090b;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:24px;color:#fff;font-family:'Plus Jakarta Sans',sans-serif;z-index:99999;user-select:none;-webkit-user-select:none;padding-top:max(env(safe-area-inset-top, 0px) + 20px, 52px);padding-bottom:max(env(safe-area-inset-bottom, 0px) + 20px, 28px);">
        <!-- Top badge -->
        <div style="display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:99px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.1);font-size:11px;color:#e4e4e7;letter-spacing:0.3px;">
          <span style="color:#e11d48;">✦</span>
          <span>Live Assistant for Logistics, Appointments & Networks</span>
        </div>

        <!-- Center Emblem -->
        <div style="display:flex;flex-direction:column;align-items:center;text-align:center;margin:auto 0;">
          <div style="width:84px;height:84px;border-radius:24px;background:linear-gradient(135deg,#e11d48,#6366f1);padding:2px;margin-bottom:20px;box-shadow:0 0 45px rgba(225,29,72,0.38);display:flex;align-items:center;justify-content:center;">
            <div style="width:100%;height:100%;border-radius:22px;background:#0a0a0c;display:flex;align-items:center;justify-content:center;">
              <svg viewBox="0 0 120 120" style="width:42px;height:42px;fill:none;stroke:#e11d48;stroke-width:14;stroke-linecap:round;stroke-linejoin:round;">
                <path d="M52 18V74H94" opacity="0.62"></path>
                <path d="M30 42V98H72"></path>
              </svg>
            </div>
          </div>
          <h1 style="font-size:32px;font-weight:800;margin:0 0 8px 0;letter-spacing:-0.5px;color:#ffffff;">Lalan AI</h1>
          <p style="font-size:11px;color:#a1a1aa;margin:0;letter-spacing:1.2px;text-transform:uppercase;font-weight:600;">Logistics • Appointments • Hospitality • Networks</p>
        </div>

        <!-- Bottom Loading & Offline Indicator -->
        <div style="width:100%;max-width:320px;display:flex;flex-direction:column;align-items:center;">
          <div style="width:100%;height:5px;background:#27272a;border-radius:99px;overflow:hidden;margin-bottom:12px;border:1px solid rgba(255,255,255,0.06);position:relative;">
            <div id="inline-splash-bar" style="width:65%;height:100%;background:linear-gradient(90deg,#e11d48,#f43f5e);border-radius:99px;transition:width 0.4s ease;"></div>
          </div>
          <span id="inline-splash-step" style="font-size:11px;color:#a1a1aa;font-family:monospace;letter-spacing:-0.2px;">Iniciando entorno Lalan AI...</span>

          <!-- Offline notice fallback -->
          <div id="inline-offline-banner" style="display:none;margin-top:14px;padding:10px 14px;border-radius:14px;background:rgba(217,119,6,0.15);border:1px solid rgba(217,119,6,0.35);color:#fef3c7;font-size:11px;line-height:1.4;text-align:center;width:100%;">
            <div style="display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;color:#fbbf24;margin-bottom:4px;">
              <span>📶 Modo sin conexión</span>
            </div>
            <span>La app está cargada en memoria. Si no avanza, toca reintentar:</span>
            <button onclick="location.reload()" style="display:block;margin:8px auto 0;background:#e11d48;color:#fff;border:none;padding:6px 14px;border-radius:10px;font-size:11px;font-weight:bold;cursor:pointer;">Reintentar carga</button>
          </div>
        </div>
      </div>
      <script>
        (function() {
          var isOffline = typeof navigator !== 'undefined' && !navigator.onLine;
          if (isOffline) {
            var banner = document.getElementById('inline-offline-banner');
            var step = document.getElementById('inline-splash-step');
            var bar = document.getElementById('inline-splash-bar');
            if (banner) banner.style.display = 'block';
            if (step) step.textContent = 'Modo sin conexión activo';
            if (bar) bar.style.width = '100%';
          }
        })();
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
